<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Fee Demo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a2233;--mut:#5f6b82;--line:#e3e7ef;--bg:#f4f6fa;--pri:#1f5eff;--pri-d:#1748c4;--ok:#0d8a4f;--warn:#9a6708;--red:#c2382e;--sbk:#f97316;--sbk-d:#c2560a;--card:#fff}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:'Noto Sans Thai','Sukhumvit Set',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
a{color:var(--pri);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topwrap{position:sticky;top:0;z-index:20}
.demo-banner{background:#1a2233;color:#fff;font-size:13.5px;display:flex;align-items:center;gap:12px;padding:7px 24px;flex-wrap:wrap}
.demo-banner b{background:#facc15;color:#1a2233;border-radius:6px;padding:1px 8px;font-size:12px}
.demo-banner a{color:#c7d6ff;margin-left:auto;white-space:nowrap}
.demo-banner button{background:transparent;color:#fff;border:1px solid #56607a;border-radius:7px;font:inherit;font-size:12.5px;padding:2px 10px;cursor:pointer}
.demo-banner button:hover{background:#2b3550}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;align-items:center;gap:22px;height:56px}
.brand{font-weight:700;font-size:17px;white-space:nowrap;color:var(--ink)}
.brand span{color:var(--pri)}
header.top nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-width:0}
header.top nav::-webkit-scrollbar{display:none}
header.top nav a{color:var(--mut);padding:6px 10px;border-radius:8px;font-weight:500;white-space:nowrap}
header.top nav a:hover{text-decoration:none;color:var(--pri);background:#eef3ff}
header.top nav a[aria-current="page"]{color:var(--pri);background:#eef3ff}
.me{margin-left:auto;color:var(--mut);font-size:13px;white-space:nowrap}
main{max-width:1440px;margin:24px auto;padding:0 24px}
h1{font-size:22px;margin:4px 0 18px}
h2{font-size:16px;margin:0 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
table.list{width:100%;border-collapse:collapse}
table.list th{background:#f8fafd;color:var(--mut);font-size:12.5px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
table.list th button{all:unset;cursor:pointer}
table.list th button:focus-visible{outline:2px solid #7aa2ff}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr:last-child td{border-bottom:none}
table.list tr.rowlink{cursor:pointer}
table.list tr.rowlink:hover{background:#f6f9ff}
.nowrap{white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip-gray{background:#eceff5;color:#4f596c}.chip-blue{background:#e3edff;color:#1748c4}
.chip-amber{background:#fdf1dc;color:#8a5c05}.chip-green{background:#dff3e8;color:#0b7543}
.chip-red{background:#fde4e2;color:#b0312a}.chip-green2{background:#0d8a4f;color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--pri);color:#fff;border:none;border-radius:9px;padding:9px 18px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--pri-d);text-decoration:none}
.btn.gray{background:#eceff5;color:var(--ink)}.btn.gray:hover{background:#dfe4ee}
.btn.red{background:var(--red)}.btn.red:hover{background:#a12b23}
.btn.green{background:var(--ok)}.btn.green:hover{background:#0a6e3f}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.flabel{font-size:12.5px;color:var(--mut)}
.flabel{color:var(--pri-d);font-weight:600;font-size:13px}
.req{color:var(--red);font-weight:700}
input,select,textarea{font-family:inherit;font-size:14.5px;padding:8px 10px;border:1px solid #c3cbd9;border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd0ff;border-color:var(--pri)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--pri)}
.msg{padding:11px 16px;border-radius:10px;margin-bottom:14px;font-weight:500}
.msg.success{background:#dff3e8;color:#0d6b3f}.msg.error{background:#fde4e2;color:#a12b23}
.msg.warning{background:#fdf1dc;color:#7c5306}.msg.info{background:#e3edff;color:#1748c4}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid2>*,.formgrid>*{min-width:0}
.card .f input,.card .f select{width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mut{color:var(--mut)}.sm{font-size:13px}
.branch-tab{display:inline-block;padding:7px 16px;border-radius:9px;font-weight:600;color:var(--mut);background:#fff;border:1px solid var(--line);cursor:pointer;font:inherit;font-weight:600}
.branch-tab[aria-pressed="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
.br-SDC{color:var(--pri-d)}.br-SBK{color:var(--sbk-d)}
.branch-tab.br-SDC{color:var(--pri-d)}.branch-tab.br-SBK{color:var(--sbk-d)}
.branch-tab.br-SDC[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.branch-tab.br-SBK[aria-pressed="true"]{background:var(--sbk);border-color:var(--sbk);color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat:hover{border-color:#bcd0ff}
.stat[aria-pressed="true"]{border-color:var(--pri);box-shadow:0 0 0 2px #dbe6ff}
.stat .n{font-size:24px;font-weight:700;line-height:1.2}
.stat .s{font-size:12.5px;color:var(--mut)}
.pager{display:flex;gap:6px;align-items:center;margin-top:14px;flex-wrap:wrap}
.pager button{padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13.5px;cursor:pointer;color:var(--pri)}
.pager button[aria-current="page"]{background:var(--pri);color:#fff;border-color:var(--pri)}
.pager button[disabled]{color:#aab3c3;cursor:default}
.pager .info{color:var(--mut);font-size:13px;margin-left:6px}
/* form */
.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.formgrid .span2{grid-column:span 2}
.formgrid .span4{grid-column:1/-1}
.ac{position:relative}
.acbox{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,30,60,.14);z-index:30;max-height:300px;overflow:auto}
.acbox [role=option]{padding:9px 14px;cursor:pointer;border-bottom:1px solid #f0f2f7}
.acbox [role=option][aria-selected="true"],.acbox [role=option]:hover{background:#eef3ff}
.cat{font-weight:700;margin:18px 0 6px;color:var(--pri-d)}
.itemrow{max-width:1000px;display:grid;grid-template-columns:1fr 90px 110px 120px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.itemrow.head{background:#eef2f8;border-radius:8px;padding:8px 10px;border-bottom:none;font-weight:700;font-size:13px}
.itemrow .rate{color:var(--mut);font-size:12.5px}
.itemrow input[type=number]{width:100%;text-align:right}
.itemrow.other{grid-template-columns:1fr 90px 130px 120px 40px}
.totals{margin-left:auto;border-collapse:collapse}
.totals td{padding:6px 10px}
.totals .num{font-weight:600;min-width:120px}
.totals tr.grand td{font-size:18px;font-weight:700;border-top:2px solid var(--line)}
.docno-box{margin-left:auto;background:#eef3ff;border:1px solid #bcd0ff;border-radius:10px;padding:8px 18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;font:inherit;font-weight:600;padding:7px 16px;cursor:pointer;color:var(--mut)}
.seg button[aria-pressed="true"].SDC{background:var(--pri);color:#fff}
.seg button[aria-pressed="true"].SBK{background:var(--sbk);color:#fff}
/* invoice sheet */
.inv-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.inv-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.sheet-wrap{overflow-x:auto;border-radius:6px;background:#dde2ea;padding:18px}
.sheet{width:794px;min-height:1060px;margin:0 auto;background:#fff;box-shadow:0 6px 24px rgba(20,30,60,.18);padding:44px 40px;font-size:11px;color:#111;position:relative;font-family:'Noto Sans Thai',Tahoma,sans-serif;line-height:1.45}
.sheet .hd{display:flex;gap:14px;align-items:flex-start}
.sheet .logo{width:46px;height:46px;flex:none}
.sheet .titlebox{margin-left:auto;border:1.5px solid #111;border-radius:8px;padding:10px 28px;text-align:center;font-weight:700;font-size:12px}
.sheet .band{background:#fff1cc;padding:3px 8px;font-weight:600;margin:14px 0 4px;display:inline-block;min-width:330px}
.sheet table.it{width:100%;border-collapse:collapse;margin-top:10px}
.sheet table.it th{background:#fff1cc;border:1px solid #111;padding:4px;font-size:10.5px;font-weight:600}
.sheet table.it td{border-left:1px solid #111;border-right:1px solid #111;padding:3px 6px;vertical-align:top}
.sheet table.it tr.grp td{padding-top:8px}
.sheet table.it tbody tr:last-child td{border-bottom:1px solid #111;padding-bottom:10px}
.sheet table.sum td{padding:2px 6px}
.sheet .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet .stamp{position:absolute;top:360px;left:50%;transform:translateX(-50%) rotate(-18deg);font-size:64px;font-weight:700;letter-spacing:4px;padding:4px 26px;border:6px solid;border-radius:14px;opacity:.16;pointer-events:none;white-space:nowrap}
.sheet .stamp.paid{color:#0d8a4f}.sheet .stamp.cancel{color:#c2382e}
.qrbox{display:flex;flex-direction:column;align-items:center;width:160px;margin-top:18px}
.qrbox .warn{background:#c2382e;color:#fff;font-weight:700;font-size:11px;border-radius:4px;padding:1px 8px;margin-top:4px}
.side .card{padding:16px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 12px 22px;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:4px;top:6px;width:10px;height:10px;border-radius:50%;background:#cfd6e4}
.timeline li.done::before{background:var(--ok)}
.timeline li.now::before{background:var(--pri);box-shadow:0 0 0 3px #dbe6ff}
.timeline li::after{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:#e3e7ef}
.timeline li:last-child::after{display:none}
.slipthumb{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfd}
.slipthumb svg{flex:none;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.audit{list-style:none;margin:0;padding:0}
.audit li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;display:grid;grid-template-columns:130px 1fr;gap:10px}
.audit li:last-child{border-bottom:none}
.audit .t{color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2233;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog{border:none;border-radius:14px;padding:0;max-width:min(440px,calc(100% - 32px));box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,28,45,.45)}
dialog .dbody{padding:20px}
dialog .dfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;background:#f8fafd;border-top:1px solid var(--line)}
.empty{text-align:center;padding:30px;color:var(--mut)}
@media(max-width:1100px){.inv-layout{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}}
@media(max-width:760px){
  main{margin:14px auto;padding:0 16px}
  header.top{padding:0 16px;gap:12px;height:auto;min-height:52px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
  header.top nav{order:3;width:100%;margin:0 -4px}
  .me{font-size:12px}
  .demo-banner{padding:7px 16px;font-size:12.5px}
  .grid2,.grid3,.formgrid{grid-template-columns:minmax(0,1fr)}
  .formgrid .span2{grid-column:auto}
  .stats{grid-template-columns:1fr 1fr}
  .itemrow{grid-template-columns:1fr 70px 96px}
  .itemrow .amt{grid-column:2/-1;text-align:right}
  .itemrow.head .amt{display:none}
  .itemrow.other{grid-template-columns:1fr 70px 40px}
  .itemrow.other .desc{grid-column:1/-1}
  .itemrow.other.head{display:none}
  .inv-layout .side{order:-1}
  header.top nav{gap:2px}
  header.top nav a{padding:6px 8px;font-size:14px}
  .docno-box{margin-left:0;width:100%}
  .sheet-wrap{padding:10px}
  .audit li{grid-template-columns:1fr;gap:2px}
  .filters .f{flex:1 1 140px}
  .filters input[type=search]{width:100%!important}
}
@media print{.topwrap,.inv-toolbar,.side,.toast{display:none!important}body{background:#fff}main{margin:0;padding:0}.sheet-wrap{padding:0;background:none}.sheet{box-shadow:none}.inv-layout{display:block}}
</style>
</head>

const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const parseD = s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const isoD = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return isoD(d)};
const fmtD = s=>{if(!s)return '—';const [y,m,d]=s.split('-');return `${d}/${m}/${y.slice(2)}`};
const fmtDL = s=>{if(!s)return '—';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};

const nowStamp = ()=>{const d=new Date();return `${fmtDL(TODAY)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let s=seed>>>0||1;return ()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}

function bahtText(num){
  num=r2(num); if(num===0) return 'ศูนย์บาทถ้วน';
  const D=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const conv=n=>{ if(n===0) return '';
    if(n>=1e6) return conv(Math.floor(n/1e6))+'ล้าน'+conv(n%1e6);
    let s='',str=String(n),len=str.length;
    for(let i=0;i<len;i++){const d=+str[i],p=len-i-1;if(!d)continue;
      if(p===0&&d===1&&len>1) s+='เอ็ด'; else if(p===1&&d===2) s+='ยี่'; else if(p===1&&d===1) s+=''; else s+=D[d];
      s+=P[p];}
    return s;};
  const b=Math.floor(num),st=Math.round((num-b)*100);
  return (b?conv(b)+'บาท':'')+(st?conv(st)+'สตางค์':'ถ้วน');
}
function areaTier(shop){ if(/kiosk/i.test(shop.type)) return AREA_RATES[0]; if(shop.size<=100) return AREA_RATES[1]; if(shop.size<=300) return AREA_RATES[2]; return AREA_RATES[3]; }
function areaAmount(shop,start,end){ const t=areaTier(shop); const d=daysIncl(start,end); return {tier:t,days:d,amount:r2(shop.size*t.rate/30*d)}; }
function calcTotals(c){
  const sub=r2(c.lines.reduce((a,l)=>a+(+l.amount||0),0));
  const vat=r2(sub*VAT), total=r2(sub+vat), wht=c.wht?r2(sub*WHT):0;
  return {sub,vat,total,wht,net:r2(total-wht)};
}

const STATE = {ISSUED:['รอชำระ','chip-gray'],PAID:['จ่ายแล้ว','chip-blue'],NOTIFIED:['แจ้งหน่วยงานแล้ว','chip-green2'],CANCELLED:['ยกเลิก','chip-red']};

function problems(c){

  if(c.replacedBy) p.push(['ถูกแทน','chip-gray']);
  return p;
}

function seed(){
  S={charges:[],seq:{}};
  const R=rng(20260925);
  const pick=a=>a[Math.floor(R()*a.length)];
  const specs=[];
  for(let i=0;i<20;i++){
    const branch=i%3===2?'SBK':(i%2?'SBK':'SDC');
    const start=addDays(TODAY,-68+Math.floor(i*3.3)+Math.floor(R()*3));
    specs.push({branch,start,i});
  }
  specs.sort((a,b)=>a.start.localeCompare(b.start));
  specs.forEach((sp,k)=>{
    const shop=pick(SHOPS[sp.branch]); const con=pick(CONTRACTORS);
    const kind=(k===6||k===15)?'CHARGE':'SF';
    const dur=kind==='CHARGE'?1:[1,2,3,5,7,14,30][Math.floor(R()*7)];
    const end=addDays(sp.start,dur-1);
    const lines=[];
    if(kind==='CHARGE'){
      const opts=[['ค่าทำความสะอาดพื้นที่ส่วนกลางหลังงานตกแต่ง',1,1500],['ค่าเช่าพื้นที่วางวัสดุชั่วคราว',3,800],['ค่าไฟฟ้าชั่วคราวระหว่างตกแต่ง',1,2500]];
      const o=opts[k%3]; lines.push({grp:'other',code:'OT-01',desc:o[0],qty:o[1],rate:o[2],amount:r2(o[1]*o[2])});
    } else {
      if(dur>=3&&R()<.8){ const a=areaAmount(shop,sp.start,end); lines.push({grp:'area',code:'AR-'+a.tier.key,desc:`${a.tier.label} (${a.tier.rate} บาท/ตร.ม./เดือน) · ${shop.size} ตร.ม. × ${a.days} วัน`,qty:1,rate:a.amount,amount:a.amount,auto:true}); }
      const n=1+Math.floor(R()*2);
      for(let j=0;j<n;j++){ const it=pick(CATALOG); if(lines.some(l=>l.code===it.code)) continue;
        const q=it.unit==='ชม.'?2+Math.floor(R()*3):it.unit==='วัน'?Math.min(dur,1+Math.floor(R()*3)):1+Math.floor(R()*(it.unit==='ตัว'?3:1));
        lines.push({grp:it.grp,code:it.code,desc:it.label,qty:q,rate:it.rate,amount:r2(q*it.rate)}); }
    }
    const c={doc:nextDocNo(sp.branch,sp.start,kind),branch:sp.branch,kind,shop:{...shop},customer:CUSTOMERS[shop.cust],contractor:con.name,phone:con.tel,
      start:sp.start,end,lines,wht:R()<.3,slips:[],receipt:'',notified:false,status:'ISSUED',issuer:pick(ISSUERS),created:sp.start,audit:[]};
    c.audit.push({t:fmtDL(sp.start)+' 09:'+pad(10+k),user:c.issuer,action:'ออกเอกสาร',detail:`ยอดสุทธิ ${money(calcTotals(c).net)} บาท`});
    const age=daysIncl(sp.start,TODAY);
    const net=calcTotals(c).net;
    if(age>40){ paySlip(c,net,addDays(sp.start,1),'QR'); c.receipt=`RC-${sp.branch}-${sp.start.slice(2,4)}${sp.start.slice(5,7)}${pad(k+11,4)}`; c.notified=age>48; }
    else if(age>18){ if(k!==9) paySlip(c,k===8?r2(net-net*0.03/1.07):net,addDays(sp.start,2),'QR'); if(k%2===0) c.receipt=`RC-${sp.branch}-${sp.start.slice(2,4)}${sp.start.slice(5,7)}${pad(k+11,4)}`; }
    // audit for seeded events
    c.slips.forEach(s=>c.audit.push({t:fmtDL(s.date)+' 14:05',user:'line-oa-bot',action:'รับสลิป',detail:`${s.bank} ${money(s.amount)} บาท (ref ${s.ref})`}));
    if(c.receipt) c.audit.push({t:fmtDL(addDays(sp.start,3))+' 08:30',user:'erp-sync',action:'ซิงก์ ERP',detail:`ใบเสร็จ ${c.receipt}`});
    if(c.notified) c.audit.push({t:fmtDL(addDays(sp.start,3))+' 10:00',user:c.issuer,action:'แจ้งหน่วยงาน',detail:'ส่งอีเมลแจ้งหน่วยงานที่เกี่ยวข้อง (จำลอง)'});
    S.charges.push(c);
  });
  // คู่ใบยกเลิก+ออกใหม่ ที่ลูกค้าจ่ายด้วย QR ใบเก่า (ไว้โชว์ "ย้ายสลิป")
  const old=S.charges.find(c=>c.kind==='SF'&&!c.slips.length&&daysIncl(c.start,TODAY)<18&&daysIncl(c.start,TODAY)>5);
  if(old){
    const nw=reissue(old,'แก้ชื่อลูกค้าบนใบ (ลูกค้าขอเปลี่ยนนิติบุคคล)',old.issuer,fmtDL(addDays(old.start,1))+' 11:20');
    paySlip(old,calcTotals(old).net,addDays(old.start,2),'QR');
    old.audit.push({t:fmtDL(addDays(old.start,2))+' 15:40',user:'line-oa-bot',action:'รับสลิป',detail:`สลิปเข้าใบที่ยกเลิกแล้ว — ลูกค้าจ่ายด้วย QR ใบเก่า`});
    void nw;
  }
  S.charges.forEach(c=>c.audit.sort((a,b)=>a.t.localeCompare(b.t)));
}
function paySlip(c,amount,date,channel){
  const banks=['ธนาคาร A','ธนาคาร B','ธนาคาร C'];
  const s={id:'S'+(hash(c.doc+date+amount+Math.random())%1e8),amount:r2(amount),date,bank:channel==='QR'?banks[hash(c.doc)%3]:channel,ref:'DEMO'+(hash(c.doc+date)%1e6).toString().padStart(6,'0'),manual:channel!=='QR',channel};
  c.slips.push(s); return s;
}
function reissue(old,reason,user='demo.user',t){
  const doc=nextDocNo(old.branch,TODAY>old.start?TODAY:old.start,old.kind);
  const nw=JSON.parse(JSON.stringify({...old,doc,slips:[],receipt:'',notified:false,status:'ISSUED',audit:[],replacedBy:null}));
  nw.replaces=old.doc; nw.created=TODAY;
  old.status='CANCELLED'; old.replacedBy=doc; old.cancelReason=reason;
  const stamp=t||nowStamp();
  old.audit.push({t:stamp,user,action:'ยกเลิก + ออกใบใหม่',detail:`${reason} → ออกแทนด้วย ${doc}`});
  nw.audit.push({t:stamp,user,action:'ออกเอกสาร (แทนใบเดิม)',detail:`ออกแทน ${old.doc} · ${reason}`});
  S.charges.push(nw); return nw;
}

function sortRows(rows,key,dir,getters){ const g=getters[key]; if(!g) return rows; return rows.slice().sort((a,b)=>{const x=g(a),y=g(b);const r=(typeof x==='number'&&typeof y==='number')?x-y:collator.compare(String(x),String(y));return dir*r;}); }

function pager(total,page,per=10){

  wireRowLinks(app);
}

/* ============ ใบแจ้งค่าบริการ ============ */
function fakeQR(seedStr,size=132){
  const N=29, R=rng(hash(seedStr)), cell=size/(N+2); let rects='';
  const inFinder=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ if(inFinder(x,y)) continue; if(R()<.47) rects+=`M${((x+1)*cell).toFixed(2)} ${((y+1)*cell).toFixed(2)}h${cell.toFixed(2)}v${cell.toFixed(2)}h-${cell.toFixed(2)}z`; }
  const finder=(fx,fy)=>{const X=(fx+1)*cell,Y=(fy+1)*cell;return `<rect x="${X}" y="${Y}" width="${7*cell}" height="${7*cell}" fill="#111"/><rect x="${X+cell}" y="${Y+cell}" width="${5*cell}" height="${5*cell}" fill="#fff"/><rect x="${X+2*cell}" y="${Y+2*cell}" width="${3*cell}" height="${3*cell}" fill="#111"/>`;};
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="QR จำลอง (ตัวอย่าง ห้ามสแกน)"><rect width="${size}" height="${size}" fill="#fff"/><path d="${rects}" fill="#111"/>${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}
    <g transform="translate(${size/2} ${size/2}) rotate(-30)"><rect x="-58" y="-11" width="116" height="22" rx="4" fill="#c2382e" opacity=".92"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Noto Sans Thai,Tahoma,sans-serif">ตัวอย่าง ห้ามสแกน</text></g></svg>`;
}

  const h=Math.round(w*1.6);
  return `<svg width="${w}" height="${h}" viewBox="0 0 80 128" role="img" aria-label="ภาพสลิปจำลอง ${money(s.amount)} บาท"><rect width="80" height="128" rx="6" fill="#f3fbf6"/><rect width="80" height="22" rx="6" fill="${s.manual?'#5f6b82':'#0d8a4f'}"/><text x="40" y="15" text-anchor="middle" font-size="8" fill="#fff" font-family="Noto Sans Thai,sans-serif">${s.manual?'บันทึกมือ':'โอนเงินสำเร็จ'}</text>
  <circle cx="40" cy="42" r="11" fill="#dff3e8"/><path d="M34 42l4 4 8-8" stroke="#0d8a4f" stroke-width="3" fill="none" stroke-linecap="round"/>

        <div class="f"><label for="pamt">ยอดเงิน *</label><input id="pamt" type="number" step="0.01" min="0.01" value="${t.net.toFixed(2)}" required></div>
        <div class="f"><label for="pdate">วันที่จ่าย</label><input id="pdate" type="date" value="${TODAY}"></div>
        <div class="f"><label for="pref">เลขอ้างอิง</label><input id="pref" placeholder="เลขที่/หมายเหตุ"></div>
      </div>
      <button class="btn" type="submit" style="margin-top:12px">💾 บันทึกการจ่าย</button></form>
    <form class="card" id="adjF"><h2>② ปรับยอดในใบเดิม</h2>
      <p class="mut sm" style="margin:0 0 10px">แก้จำนวน/ยอดแต่ละบรรทัด — ระบบคิด VAT/หัก ณ ที่จ่าย/ยอดรวมใหม่ และเก็บ audit</p>
      ${guard?'<div class="msg warning sm">⚠️ ใบนี้ออกใบเสร็จ/แจ้งหน่วยงานแล้ว — ต้องระบุเหตุผลก่อนปรับยอด</div>':''}
      <div class="tblwrap" style="border:none"><table class="list"><thead><tr><th>รายการ</th><th class="num">จำนวน</th><th class="num">จำนวนเงิน</th></tr></thead><tbody>
        ${c.lines.map((l,i)=>`<tr><td class="sm" style="min-width:160px">${esc(l.desc)}</td>
          <td class="num"><label class="sr-only" for="aq${i}">จำนวน ${esc(l.desc)}</label><input id="aq${i}" data-aq="${i}" type="number" step="0.5" min="0" value="${l.qty}" style="width:70px;text-align:right" ${l.auto?'readonly':''}></td>
          <td class="num"><label class="sr-only" for="aa${i}">จำนวนเงิน ${esc(l.desc)}</label><input id="aa${i}" data-aa="${i}" type="number" step="0.01" min="0" value="${l.amount.toFixed(2)}" style="width:110px;text-align:right"></td></tr>`).join('')}
      </tbody></table></div>
      <label class="sm" style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer"><input type="checkbox" id="awht" ${c.wht?'checked':''}> หัก ณ ที่จ่าย 3% <span class="mut">(ลูกค้าบางรายหักเองตอนโอน)</span></label>
      <div class="sm" style="margin-top:6px">ยอดใหม่: <b id="anet">${money(t.net)}</b> บาท <span class="mut">(เดิม ${money(t.net)})</span></div>
      <label class="sr-only" for="areason">เหตุผลการปรับยอด</label><input id="areason" placeholder="เหตุผลการปรับยอด *" style="width:100%;margin-top:10px">
      <button class="btn" type="submit" style="margin-top:10px">🧮 ปรับยอด + คิดใหม่</button></form>
  </div>
  <form class="card" id="reF"><h2>③ ยกเลิก + ออกใบใหม่แทน</h2>
    <p class="mut sm" style="margin:0 0 12px">ยกเลิกใบนี้ (ไม่ลบ — เปลี่ยนสถานะ) แล้วสร้างใบใหม่ คัดลอกรายการ ได้เลขใหม่ ผูกกันไว้ให้ตามรอยได้</p>
    <label class="sr-only" for="rreason">เหตุผลการยกเลิก</label><input id="rreason" placeholder="เหตุผลการยกเลิก+ออกใหม่ *" style="width:100%">
    <button class="btn red" type="submit" style="margin-top:10px">🔁 ยกเลิก + ออกใบใหม่</button></form>`}
  <div class="card"><h2>ประวัติการแก้ไข (Audit log)</h2>
    <ul class="audit">${(c.audit||[]).slice().reverse().map(a=>`<li><span class="t">${esc(a.t)}</span><span><b>${esc(a.action)}</b> — ${esc(a.detail)} <span class="mut sm">(${esc(a.user)})</span></span></li>`).join('')||'<li class="mut">ยังไม่มี</li>'}</ul></div>`;
  const rerender=()=>{save();viewReconcileDetail(doc);};
  $$('[data-move]').forEach(b=>b.onclick=async()=>{
    const nw=byDoc(c.replacedBy); if(!nw) return;
    if(!await confirmBox('ย้ายสลิป',`ย้ายสลิปนี้ไปใบใหม่ <b>${nw.doc}</b>?`,'ย้ายสลิป')) return;
    const i=c.slips.findIndex(s=>s.id===b.dataset.move); const [s]=c.slips.splice(i,1); nw.slips.push(s);
    addAudit(c,'ย้ายสลิป',`ย้ายสลิป ${money(s.amount)} บาท (ref ${s.ref}) → ${nw.doc}`); addAudit(nw,'รับสลิป (ย้ายมา)',`จาก ${c.doc} · ${money(s.amount)} บาท`);
    rerender(); toast('ย้ายสลิปไป '+nw.doc+' แล้ว'); });
  if(cancelled) return;
  $('#payF').onsubmit=e=>{e.preventDefault();const amt=r2(+$('#pamt').value);if(!(amt>0)){toast('กรอกยอดเงินให้ถูกต้อง');return;}
    const s=paySlip(c,amt,$('#pdate').value||TODAY,$('#pch').value); if($('#pref').value.trim()) s.ref=$('#pref').value.trim();
    addAudit(c,'บันทึกจ่าย (มือ)',`${s.channel} ${money(amt)} บาท · ref ${s.ref}`); rerender(); toast('บันทึกการจ่ายแล้ว'); };
  const preview=()=>{const lines=c.lines.map((l,i)=>({...l,amount:+$(`[data-aa="${i}"]`).value||0}));$('#anet').textContent=money(calcTotals({lines,wht:$('#awht').checked}).net);};
  $$('[data-aq]').forEach(inp=>inp.oninput=()=>{const i=+inp.dataset.aq,l=c.lines[i];if(!l.auto){$(`[data-aa="${i}"]`).value=(r2((+inp.value||0)*l.rate)).toFixed(2);}preview();});
  $$('[data-aa]').forEach(inp=>inp.oninput=preview); $('#awht').onchange=preview;
  $('#adjF').onsubmit=async e=>{e.preventDefault();const reason=$('#areason').value.trim();
    if(!reason){toast('ระบุเหตุผลการปรับยอดก่อน');$('#areason').focus();return;}
    const before=calcTotals(c).net; const changes=[];
    const nl=c.lines.map((l,i)=>{const q=+$(`[data-aq="${i}"]`).value||0,a=r2(+$(`[data-aa="${i}"]`).value||0);if(q!==l.qty||a!==l.amount)changes.push(`${l.code}: ${money(l.amount)}→${money(a)}`);return {...l,qty:q,amount:a};});
    const nw=$('#awht').checked; if(nw!==c.wht) changes.push(`หัก ณ ที่จ่าย ${c.wht?'หัก':'ไม่หัก'}→${nw?'หัก':'ไม่หัก'}`);
    if(!changes.length){toast('ยังไม่มีการเปลี่ยนแปลง');return;}
    const after=calcTotals({lines:nl,wht:nw}).net;
    if(!await confirmBox('ยืนยันปรับยอด',`${c.doc}: ${money(before)} → <b>${money(after)}</b> บาท`,'ปรับยอด')) return;
    c.lines=nl; c.wht=nw; addAudit(c,'ปรับยอด',`${money(before)} → ${money(after)} บาท · ${changes.join(', ')} · เหตุผล: ${reason}`); rerender(); toast('ปรับยอดแล้ว'); };
  $('#reF').onsubmit=async e=>{e.preventDefault();const reason=$('#rreason').value.trim();
    if(!reason){toast('ระบุเหตุผลการยกเลิกก่อน');$('#rreason').focus();return;}
    if(!await confirmBox('ยกเลิก + ออกใบใหม่',`ยกเลิก <b>${c.doc}</b> และออกใบใหม่แทน?<br><span class="mut">ใบเดิมจะเปลี่ยนสถานะเป็น “ยกเลิก” (ไม่ถูกลบ)</span>`,'ยกเลิก + ออกใหม่',true)) return;
    const nw=reissue(c,reason); save(); location.hash='#/reconcile/'+nw.doc; toast(`ออก ${nw.doc} แทน ${c.doc} แล้ว`); };
}
function viewNotFound(doc){ $('#app').innerHTML=`<div class="card"><h1>ไม่พบเอกสาร</h1><p class="mut">ไม่มีเอกสาร ${esc(doc||'')} ในข้อมูลเดโม (อาจรีเซ็ตข้อมูลไปแล้ว)</p><a class="btn" href="#/">กลับ Dashboard</a></div>`; }

/* ============ router ============ */
function route(){
  const h=decodeURIComponent(location.hash.replace(/^#/,''))||'/';
  const parts=h.split('/').filter(Boolean);
  let nav='dash', title='Dashboard';
  if(parts[0]==='new'){nav='new';title='ออกใบแจ้งหนี้';viewForm('SF');}
  else if(parts[0]==='other'){nav='other';title='ใบคิดค่าบริการอื่นๆ';viewForm('CHARGE');}
  else if(parts[0]==='inv'){nav='dash';title=parts[1];viewInvoice(parts[1]);}
  else if(parts[0]==='reconcile'&&parts[1]){nav='reconcile';title='จัดการ '+parts[1];viewReconcileDetail(parts[1]);}
  else if(parts[0]==='reconcile'){nav='reconcile';title='จัดการรายการ';viewReconcile();}
  else viewDashboard();
  $$('[data-nav]').forEach(a=>a.dataset.nav===nav?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  document.title=`${title} · Service Fee Demo`;
  window.scrollTo(0,0);
}
let lastHash=null;
window.addEventListener('hashchange',()=>{route();$('#app').focus({preventScroll:true});});
$('#resetBtn').onclick=async()=>{ if(!await confirmBox('รีเซ็ตข้อมูลเดโม','ล้างทุกอย่างที่ทำไว้ แล้วกลับไปใช้ข้อมูลตัวอย่างชุดเริ่มต้น?','รีเซ็ต',true)) return;
  try{localStorage.removeItem(LS_KEY);}catch(e){} seed(); save(); formSt=null; Object.assign(dashSt,{b:'',q:'',date:'',kind:'',state:'',page:1}); Object.assign(recSt,{b:'',q:'',state:'',problem:false,page:1});
  if(location.hash&&location.hash!=='#/') location.hash='#/'; else route(); toast('รีเซ็ตข้อมูลเดโมแล้ว'); };
S=load(); if(!S){ seed(); save(); }
route();
</script>
</body>
</html>
