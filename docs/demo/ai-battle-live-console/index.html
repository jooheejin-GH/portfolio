<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Battle Live Console · เดโม</title>
<meta name="description" content="เดโมคอนโซลคุมเวทีแข่ง AI ภายในองค์กร — Ban/Draft โจทย์ จับเวลา กรรมการ AI ตรวจ เปิดคะแนนทีละมิติ โหวตผู้ชม และสายการแข่ง 8 ทีม (ข้อมูลตัวอย่างทั้งหมด)">
<meta name="theme-color" content="#02080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02080b;--bg2:#062430;--panel:#07151c;--panel2:#0a1f28;--line:#0f3a4a;--line2:#16546a;
  --fg:#d7f4fb;--mut:#7fa4b1;--dim:#4a7280;
  --a:#0D96C2;--a-soft:rgba(13,150,194,.14);--b:#FF8800;--b-soft:rgba(255,136,0,.14);
  --gold:#FFD600;--ok:#35c46a;--bad:#ff5a5a;--focus:#FFD600;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#02080b}
body{margin:0;font-family:"Kanit",system-ui,"Segoe UI",Tahoma,sans-serif;font-weight:300;font-size:15px;line-height:1.5;color:var(--fg);
  background:radial-gradient(1100px 520px at 50% -8%,rgba(13,150,194,.22),transparent 60%),linear-gradient(160deg,#000 0%,#041820 55%,#05313b 100%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(rgba(13,150,194,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(13,150,194,.07) 1px,transparent 1px);background-size:40px 40px}
a{color:#7fdcf5}
b,strong{font-weight:600}
.orb{font-family:"Orbitron","Kanit",sans-serif;letter-spacing:.04em}
.num{font-family:"Orbitron",sans-serif;font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px;position:relative;z-index:1}

/* demo bar */
.demobar{position:sticky;top:0;z-index:50;background:#fff4c2;color:#2a2305;font-size:13px;font-weight:400;border-bottom:1px solid #e0cf7a}
.demobar .wrap{display:flex;align-items:center;gap:6px 12px;min-height:34px;flex-wrap:wrap;padding-top:4px;padding-bottom:4px}
.demobar .tag{background:#2a2305;color:#FFD600;font-weight:600;border-radius:4px;padding:0 7px;font-size:11px;letter-spacing:.08em}
.demobar .sp{flex:1}
.demobar a{color:#0b4f66;font-weight:600;white-space:nowrap}
.demobar button{font:inherit;font-size:12px;background:#2a2305;color:#fff4c2;border:0;border-radius:6px;padding:3px 10px;cursor:pointer;white-space:nowrap}

/* header + nav */
header.top{position:relative;z-index:2;border-bottom:1px solid var(--line);background:rgba(2,8,11,.72);backdrop-filter:blur(6px)}
header.top .wrap{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-top:10px;padding-bottom:0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),#064a60);font-family:Orbitron;font-weight:900;font-size:13px;color:#fff;box-shadow:0 0 18px rgba(13,150,194,.5)}
.brand .t1{font-family:Orbitron;font-weight:900;font-size:16px;letter-spacing:.08em;color:#fff;line-height:1.1}
.brand .t2{font-size:11px;color:var(--mut);letter-spacing:.18em;font-family:Orbitron}
.live-pill{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px var(--bad);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
nav.tabs{width:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin-top:6px}
nav.tabs a{flex:none;padding:9px 12px 10px;color:var(--mut);text-decoration:none;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a[aria-current="page"]{color:#fff;border-bottom-color:var(--a);font-weight:400}
nav.tabs a .lk{font-size:11px;opacity:.6}

main{position:relative;z-index:1;padding:24px 16px 40px}
h1{font-size:22px;font-weight:600;margin:0 0 4px;color:#fff}
h1:focus{outline:none}
h2{font-size:17px;font-weight:600;margin:0 0 10px;color:#fff}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.panel{background:linear-gradient(180deg,rgba(10,31,40,.92),rgba(7,21,28,.92));border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mut)}.small{font-size:13px}
.btn{font:inherit;font-weight:400;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);padding:10px 16px;cursor:pointer;text-decoration:none;min-height:44px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--a);background:#0c2835}
.btn:active{transform:translateY(1px)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.42;cursor:not-allowed;pointer-events:none}
.btn.pri{background:linear-gradient(135deg,#0fa6d6,#0a6f8f);border-color:#39c3ee;color:#fff;font-weight:600;box-shadow:0 0 24px rgba(13,150,194,.35)}
.btn.pri:hover{background:linear-gradient(135deg,#19b5e6,#0b7fa3)}
.btn.gold{background:linear-gradient(135deg,#ffd600,#f5a300);border-color:#ffe36a;color:#211a00;font-weight:600;box-shadow:0 0 24px rgba(255,214,0,.3)}
.btn.big{font-size:18px;padding:14px 22px;min-height:56px;border-radius:14px}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.chip.ok{color:#9ff0bd;border-color:rgba(53,196,106,.5);background:rgba(53,196,106,.12)}
.chip.run{color:#ffe98a;border-color:rgba(255,214,0,.45);background:rgba(255,214,0,.1)}
.chip.a{color:#8fdcf5;border-color:rgba(13,150,194,.6);background:var(--a-soft)}
.chip.b{color:#ffc27a;border-color:rgba(255,136,0,.6);background:var(--b-soft)}
.ta{color:#46c3ec}.tb{color:#ffa640}

/* team badges */
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none;border:2px solid var(--line2);background:#0a1f28}
.av.a{border-color:var(--a);background:var(--a-soft)}.av.b{border-color:var(--b);background:var(--b-soft)}
.av.xl{width:84px;height:84px;font-size:46px;border-radius:20px}

/* match card */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin:6px 0 14px}
.vs .side{display:flex;align-items:center;gap:12px;min-width:0}
.vs .side.b{flex-direction:row-reverse;text-align:right}
.vs .nm{font-weight:600;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.vs .side.a .nm{color:#5fd0f3}.vs .side.b .nm{color:#ffae55}
.vs .x{font-family:Orbitron;font-weight:900;color:var(--dim);font-size:22px}
.probbox{border:1px dashed var(--line2);border-radius:12px;padding:10px 14px;background:rgba(255,214,0,.04)}
.probbox .k{font-size:12px;color:var(--mut)}
.probbox .v{font-weight:600;color:var(--gold)}

/* stepper */
ol.stepper{list-style:none;padding:0;margin:14px 0 18px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;counter-reset:s}
ol.stepper li{counter-increment:s}
ol.stepper a,ol.stepper span.st{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:13px;color:var(--dim);text-decoration:none;padding:8px 2px;border-radius:10px;border:1px solid transparent;height:100%}
ol.stepper .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:Orbitron;font-weight:800;font-size:13px;border:2px solid var(--line2);background:#061319}
ol.stepper .n::before{content:counter(s)}
ol.stepper .done a{color:var(--mut)}
ol.stepper .done .n{background:var(--a);border-color:var(--a);color:#fff}
ol.stepper .done .n::before{content:"✓"}
ol.stepper .cur a{color:#fff;border-color:var(--line2);background:rgba(13,150,194,.1)}
ol.stepper .cur .n{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(255,214,0,.45)}
ol.stepper a:hover{background:rgba(13,150,194,.08)}

/* log */
ul.log{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto;font-size:13px}
ul.log li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(15,58,74,.6)}
ul.log time{color:var(--dim);font-family:Orbitron;font-size:11px;flex:none;padding-top:2px}

/* mini bracket list */
.mlist{display:grid;gap:6px}
.mitem{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:10px;background:#061319;border:1px solid var(--line)}
.mitem .id{font-family:Orbitron;font-size:11px;color:var(--dim);width:34px;flex:none}
.mitem.now{border-color:var(--gold);box-shadow:0 0 12px rgba(255,214,0,.25)}
.mitem .w{color:#fff;font-weight:600}

/* draft */
.turn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;margin-bottom:14px;border:1px solid var(--line2);background:#061319}
.turn.a{border-color:var(--a);box-shadow:0 0 22px rgba(13,150,194,.2)}.turn.b{border-color:var(--b);box-shadow:0 0 22px rgba(255,136,0,.2)}
.seq{display:flex;gap:6px;flex-wrap:wrap}
.seq span{font-size:12px;padding:3px 9px;border-radius:8px;border:1px solid var(--line2);color:var(--dim)}
.seq span.done{color:var(--mut);text-decoration:line-through}
.seq span.now{color:#fff;border-color:var(--gold)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{position:relative;border:1px solid var(--line2);border-radius:14px;padding:14px;background:#071a22;display:flex;flex-direction:column;gap:8px;min-width:0;transition:opacity .25s,transform .25s,border-color .25s}
.pcard .pid{font-family:Orbitron;font-size:11px;color:var(--dim)}
.pcard h3{margin:0;font-size:16px;font-weight:600;line-height:1.35;color:#fff}
.pcard p{margin:0;font-size:13px;color:var(--mut)}
.pcard .foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcard.banned{opacity:.38;border-style:dashed}
.pcard.banned h3{text-decoration:line-through}
.pcard.pick-a{border-color:var(--a);box-shadow:0 0 18px rgba(13,150,194,.3)}
.pcard.pick-b{border-color:var(--b);box-shadow:0 0 18px rgba(255,136,0,.3)}
.pcard.spin{border-color:var(--gold);box-shadow:0 0 26px rgba(255,214,0,.55);transform:scale(1.02)}
.pcard.chosen{border-color:var(--gold);box-shadow:0 0 34px rgba(255,214,0,.55)}
.stamp{position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.stamp.ban{background:rgba(255,90,90,.18);color:#ff9a9a;border:1px solid rgba(255,90,90,.5)}
.stamp.pa{background:var(--a-soft);color:#8fdcf5;border:1px solid var(--a)}
.stamp.pb{background:var(--b-soft);color:#ffc27a;border:1px solid var(--b)}
.stamp.win{background:var(--gold);color:#1d1600}
.cat{font-size:11px;padding:1px 8px;border-radius:6px;background:rgba(127,164,177,.14);color:#b9d6df;border:1px solid rgba(127,164,177,.3)}

/* timer */
.timer{font-family:Orbitron;font-weight:900;font-size:clamp(56px,13vw,132px);line-height:1;text-align:center;color:#fff;letter-spacing:.04em;text-shadow:0 0 34px rgba(13,150,194,.55);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--gold);text-shadow:0 0 34px rgba(255,214,0,.5)}
.timer.over{color:var(--bad);text-shadow:0 0 34px rgba(255,90,90,.55)}
.tbar{height:8px;border-radius:99px;background:#061319;border:1px solid var(--line);overflow:hidden;margin:14px 0}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--gold));transition:width .25s linear}
.sublist{display:grid;gap:10px}
.subrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#061319;flex-wrap:wrap}
.subrow .info{flex:1;min-width:150px}

/* judge */
.job{border:1px solid var(--line);border-radius:14px;padding:14px;background:#061319}
.prog{height:12px;border-radius:99px;background:#02080b;border:1px solid var(--line);overflow:hidden;margin:8px 0 6px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0a6f8f,var(--a),#7fe3ff);background-size:200% 100%;animation:shimmer 1.2s linear infinite;transition:width .3s}
.prog.done i{background:var(--ok);animation:none}
@keyframes shimmer{to{background-position:-200% 0}}
.poll{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:#01080b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:#8fb8c4;min-height:124px;overflow:hidden;overflow-wrap:anywhere}
.poll div{white-space:pre-wrap}
.poll .ok{color:#9ff0bd}.poll .run{color:#ffe98a}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--gold);animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
table.sc{width:100%;border-collapse:collapse;font-size:14px}
table.sc th,table.sc td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.sc th{font-weight:400;color:var(--mut);font-size:12px}
table.sc td.v{font-family:Orbitron;font-weight:800;white-space:nowrap;text-align:right}
table.sc tfoot td{font-weight:600;color:#fff;border-bottom:0}
.verdict{font-family:Orbitron;font-weight:800;font-size:12px;letter-spacing:.06em;padding:2px 9px;border-radius:6px;background:rgba(255,214,0,.14);color:var(--gold);border:1px solid rgba(255,214,0,.4)}
.fb{margin-top:10px;font-size:14px;padding:10px 12px;border-left:3px solid var(--gold);background:rgba(255,214,0,.05);border-radius:0 10px 10px 0}

/* reveal */
.rv-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:18px}
.tot{text-align:center;min-width:0}
.tot .nm{font-weight:600;font-size:18px;overflow-wrap:anywhere}
.tot.a .nm,.tot.a .val{color:#46c3ec}.tot.b .nm,.tot.b .val{color:#ffa640}
.tot .val{font-family:Orbitron;font-weight:900;font-size:clamp(40px,7vw,70px);line-height:1.05;font-variant-numeric:tabular-nums}
.tot .mx{font-size:12px;color:var(--dim)}
.tot.lead .val{text-shadow:0 0 30px currentColor}
.rv-top .x{font-family:Orbitron;font-weight:900;color:var(--dim);font-size:26px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(120px,190px) 64px minmax(0,1fr);gap:10px;align-items:center;margin:12px 0}
.drow .barw{height:24px;border-radius:8px;background:#041017;border:1px solid var(--line);overflow:hidden;display:flex}
.drow .barw.l{justify-content:flex-end}
.drow .bar{height:100%;width:var(--w)}
.drow .barw.l .bar{background:linear-gradient(270deg,#7fe3ff,var(--a))}
.drow .barw.r .bar{background:linear-gradient(90deg,#ffc27a,var(--b))}
.drow.new .bar{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.drow.new .dv{animation:pop .5s .9s both}
@keyframes grow{from{width:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.dv{font-family:Orbitron;font-weight:800;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.dv.a{color:#46c3ec}.dv.b{color:#ffa640}
.dv.win{text-shadow:0 0 16px currentColor}
.dlabel{text-align:center;font-weight:600;font-size:15px;line-height:1.25}
.dlabel .mx{display:block;font-size:11px;color:var(--dim);font-weight:300}
.drow.hid{opacity:.35}
.drow.hid .dv{color:var(--dim)}
.why{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;color:var(--mut);margin:-4px 0 8px}
.why p{margin:0;padding:6px 10px;border-radius:8px;background:#041017}
.why p:last-child{text-align:right}

/* vote */
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;align-items:center}
.vbar{margin:14px 0}
.vbar .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.vbar .cnt{font-family:Orbitron;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.vbar .track{height:30px;border-radius:10px;background:#041017;border:1px solid var(--line);overflow:hidden}
.vbar .track i{display:block;height:100%;transition:width .35s ease-out}
.vbar.a .track i{background:linear-gradient(90deg,var(--a),#7fe3ff)}.vbar.b .track i{background:linear-gradient(90deg,var(--b),#ffc27a)}
.qr{background:#fff;border-radius:12px;padding:10px;width:170px;margin:0 auto}
.qr svg{display:block;width:100%;height:auto}

/* result */
.winner{text-align:center;padding:26px 10px;position:relative;overflow:hidden}
.winner .lbl{font-family:Orbitron;font-size:13px;letter-spacing:.35em;color:var(--mut)}
.winner .nm{font-size:clamp(28px,6vw,48px);font-weight:800;color:var(--gold);text-shadow:0 0 34px rgba(255,214,0,.5);margin:10px 0 4px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(420px) rotate(560deg);opacity:0}}

/* bracket */
.bracket{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:14px}
.bcol h3{font-family:Orbitron;font-size:12px;letter-spacing:.14em;color:var(--mut);font-weight:600;margin:0 0 4px;text-align:center}
.bm{border:1px solid var(--line2);border-radius:12px;background:#061319;overflow:hidden;position:relative}
.bm.now{border-color:var(--gold);box-shadow:0 0 22px rgba(255,214,0,.3)}
.bm .tag{position:absolute;top:-1px;right:-1px;font-family:Orbitron;font-size:10px;padding:1px 7px;border-radius:0 12px 0 8px;background:var(--gold);color:#1d1600;font-weight:800}
.bm .tr{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:42px;font-size:14px}
.bm .tr+.tr{border-top:1px solid var(--line)}
.bm .tr .e{font-size:18px;width:24px;text-align:center}
.bm .tr .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .tr .s{font-family:Orbitron;font-size:12px;color:var(--mut)}
.bm .tr.w{background:rgba(13,150,194,.14);color:#fff;font-weight:600}
.bm .tr.w .s{color:var(--gold)}
.bm .tr.l{opacity:.45}
.bm .tr.tbd{color:var(--dim);font-style:italic}
.champ{border:2px solid var(--gold);border-radius:16px;padding:18px 12px;text-align:center;background:rgba(255,214,0,.06);box-shadow:0 0 30px rgba(255,214,0,.2)}
.champ .e{font-size:44px}
.champ .n{font-weight:800;color:var(--gold);font-size:19px}

/* board (big screen) */
body.stage header.top{display:none}
.board{min-height:calc(100vh - 34px);display:flex;flex-direction:column;justify-content:center;padding:26px 0 60px;text-align:center}
.board .hd{font-family:Orbitron;font-size:13px;letter-spacing:.3em;color:var(--mut);margin-bottom:18px}
.board .hd b{color:var(--a);font-family:Kanit,sans-serif;letter-spacing:.06em;font-weight:600;font-size:15px}
.board .bigvs{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;max-width:1100px;margin:0 auto;width:100%}
.board .card{border:2px solid;border-radius:20px;padding:26px 16px;background:var(--panel);min-width:0}

 {id:'P10',c:'hr',t:'คู่มือพนักงานใหม่วันแรก ภายใน 1 หน้า',d:'Checklist วันแรก · ผังคนที่ต้องรู้จัก · ข้อความต้อนรับ',n:3},
 {id:'P11',c:'cs',t:'ตอบรีวิว 1 ดาว 5 รีวิวให้ลูกค้ากลับมา',d:'คำตอบ 5 แบบ · แนวทางตอบรีวิว · สิ่งที่ต้องแก้ภายใน',n:3},
 {id:'P12',c:'data',t:'ประมาณการที่จอดรถช่วงเทศกาล',d:'ตัวเลขคาดการณ์ · สมมติฐาน · แผนจัดการคิวรถ',n:3}
];
const DIMS=[
 {k:'prompt',l:'คุณภาพ Prompt',mx:25},
 {k:'insight',l:'Insight / ความเข้าใจโจทย์',mx:25},
 {k:'orch',l:'การประสานใช้ AI',mx:20},
 {k:'output',l:'คุณภาพผลงาน',mx:30}
];
const WHY={
 prompt:{hi:['สั่งงานเป็นขั้นตอน ใส่บทบาท บริบท และรูปแบบผลลัพธ์ครบ แล้ว iterate จนตรงโจทย์','Prompt ชัด อ้างข้อมูลโจทย์ตรงจุด กำหนดความยาวและน้ำเสียงไว้ล่วงหน้า'],mid:['ให้บริบทพอใช้ แต่ยังไม่กำหนดรูปแบบผลลัพธ์ ต้องแก้ซ้ำหลายรอบ','แตกขั้นตอนได้ดีบางส่วน แต่ prompt ช่วงท้ายสั้นเกินไป'],lo:['สั่งกว้างเกินไป ขาดบริบทจากข้อมูลโจทย์ ผลจึงคลาดจากที่ขอ','ใช้ prompt เดียวรวดเดียว ไม่มีการตรวจหรือปรับแก้']},
 insight:{hi:['จับประเด็นที่ซ่อนในข้อมูลโจทย์ได้ และใช้เป็นแกนของทุกชิ้นงาน','เห็นต้นเหตุจริงของปัญหา ไม่หยุดแค่อาการที่เห็นผิวเผิน'],mid:['เข้าใจโจทย์ถูกทาง แต่ยังไม่ได้ใช้ตัวเลขในข้อมูลโจทย์สนับสนุน','Insight สมเหตุสมผล แต่ยังกว้างและคาดเดาได้'],lo:['ตีความโจทย์คลาดไปบางส่วน พลาดเงื่อนไขสำคัญ 1 ข้อ','สรุปจากความรู้ทั่วไปมากกว่าข้อมูลที่โจทย์ให้มา']},
 orch:{hi:['แบ่งงานให้ AI หลายตัวตามจุดเด่น แล้วใช้อีกตัวตรวจทานผลลัพธ์','ต่อผลลัพธ์จากขั้นหนึ่งไปอีกขั้นอย่างเป็นระบบ มีการ cross-check'],mid:['ใช้ AI มากกว่าหนึ่งตัว แต่ยังไม่ได้ส่งต่องานกันชัดเจน','มีขั้นตรวจทาน แต่ทำด้วยมือเป็นส่วนใหญ่'],lo:['ใช้ AI ตัวเดียวทำทุกอย่าง ไม่มีขั้นตรวจสอบ','สลับเครื่องมือไปมาโดยไม่มีเหตุผลรองรับ']},
 output:{hi:['ส่งครบทุกชิ้น ตรงสเปก ภาษาไทยเรียบร้อย พร้อมใช้งานจริง','ผลงานครบและนำไปใช้ต่อได้ทันที ตัวเลขตรวจแล้วถูกต้อง'],mid:['ส่งครบ แต่มี 1 ชิ้นยาวเกินเงื่อนไขที่โจทย์กำหนด','คุณภาพดีโดยรวม มีจุดพิมพ์ผิดและตัวเลขไม่ตรงเล็กน้อย'],lo:['ส่งไม่ครบ ขาด 1 ชิ้นงานที่โจทย์บังคับ','ผลงานยังเป็นร่าง ต้องแก้อีกมากก่อนใช้งานจริง']}
};
const ROUND={QF:'รอบ 8 ทีม',SF:'รอบรองชนะเลิศ',F:'รอบชิงชนะเลิศ'};
const NEXT={QF1:['SF1','a'],QF2:['SF1','b'],QF3:['SF2','a'],QF4:['SF2','b'],SF1:['F','a'],SF2:['F','b']};
const DRAFT_SEQ=[['a','ban'],['b','ban'],['a','pick'],['b','pick']];
const STEPS=[{r:'draft',l:'Ban/Draft'},{r:'live',l:'แข่ง'},{r:'judge',l:'ตรวจ'},{r:'reveal',l:'เปิดคะแนน'},{r:'vote',l:'โหวต'},{r:'result',l:'ผลแพ้ชนะ'}];
const DUR=20*60*1000, JOB_MS=[7200,9400], VOTE_MS=7000;

/* ---------- seeded rng ---------- */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- state ---------- */
let S=null;
function newMatch(id,r,a,b){return{id,r,a,b,step:0,draft:{pool:null,acts:[],spinAt:null,problem:null},timer:{remain:DUR,since:null,speed:1},subs:{a:null,b:null},judge:null,reveal:0,vote:{status:'idle',since:null},winner:null,final:null,done:false};}
function seed(){
  S={v:1,salt:Math.random().toString(36).slice(2,8),used:[],log:[],matches:[
    newMatch('QF1','QF','t1','t2'),newMatch('QF2','QF','t3','t4'),newMatch('QF3','QF','t5','t6'),newMatch('QF4','QF','t7','t8'),
    newMatch('SF1','SF',null,null),newMatch('SF2','SF',null,null),newMatch('F','F',null,null)]};
  addLog('เปิดทัวร์นาเมนต์ · 8 ทีม · รอบแรก 4 คู่');
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&d.v===1&&Array.isArray(d.matches)){S=d;return;}}}catch(e){}seed();save();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function addLog(msg){const d=new Date();S.log.unshift({t:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'),m:msg});S.log=S.log.slice(0,40);}
const team=id=>TEAMS.find(t=>t.id===id);
const prob=id=>PROBLEMS.find(p=>p.id===id);
const mById=id=>S.matches.find(m=>m.id===id);
function cur(){return S.matches.find(m=>!m.done&&m.a&&m.b)||null;}
function champion(){const f=mById('F');return f.done?team(f.winner):null;}
function matchNo(m){const same=S.matches.filter(x=>x.r===m.r);return same.length>1?' · คู่ที่ '+(same.indexOf(m)+1):'';}

/* ---------- derived: scores, votes ---------- */
function scoresFor(m,side){
  const T=team(m[side]);const r=rng(hash(S.salt+m.id+T.id));
  const base=T.skill+(r()-.5)*.18;const dims={};let total=0;
  DIMS.forEach(d=>{let f=Math.min(.97,Math.max(.32,base+(r()-.5)*.28));let v=Math.round(f*d.mx*2)/2;const pct=v/d.mx;const bucket=pct>=.8?'hi':pct>=.6?'mid':'lo';const w=WHY[d.k][bucket][side==='b'?1:0];dims[d.k]={v,why:w};total+=v;});
  total=Math.round(total*10)/10;
  const verdict=total>=85?'Excellent':total>=65?'Good':total>=50?'Average':total>=35?'Weak':'Fail';
  const rel=DIMS.map(d=>({d,p:dims[d.k].v/d.mx})).sort((x,y)=>y.p-x.p);
  const fb=`จุดแข็งเด่นสุดของ${T.name}คือ${rel[0].d.l} — ${dims[rel[0].d.k].why.replace(/^./,c=>c)} ส่วนที่เสียคะแนนหลักคือ${rel[3].d.l} แนะนำให้กลับไปอ่านเงื่อนไขในโจทย์อีกรอบก่อนส่ง และให้ AI ช่วยตรวจทานกับข้อมูลโจทย์ทุกครั้ง`;
  return{dims,total,verdict,fb};
}
function scores(m){return{a:scoresFor(m,'a'),b:scoresFor(m,'b')};}
function voteTarget(m){const r=rng(hash(S.salt+m.id+'vote'));const tot=90+Math.floor(r()*80);const share=.34+r()*.32;const a=Math.round(tot*share);return{a,b:tot-a};}
function voteNow(m){const t=voteTarget(m);if(m.vote.status==='closed')return t;if(m.vote.status!=='open')return{a:0,b:0};
  const f=Math.min(1,(Date.now()-m.vote.since)/VOTE_MS);const e=1-Math.pow(1-f,1.6);
  const jitterA=Math.sin(f*17)*.06,jitterB=Math.cos(f*13)*.06;
  return{a:Math.round(t.a*Math.min(1,Math.max(0,e+jitterA*(1-f)))),b:Math.round(t.b*Math.min(1,Math.max(0,e+jitterB*(1-f))))};}
function finalOf(m){const s=scores(m),v=voteTarget(m);const tot=v.a+v.b;const va=Math.round(v.a/tot*100)/10,vb=Math.round(v.b/tot*100)/10;
  return{ai:{a:s.a.total,b:s.b.total},vote:{a:va,b:vb},cnt:v,fin:{a:Math.round((s.a.total+va)*10)/10,b:Math.round((s.b.total+vb)*10)/10}};}

/* ---------- timer ---------- */
function tRem(t){return Math.max(0,t.remain-(t.since?(Date.now()-t.since)*t.speed:0));}
function fmt(ms){const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function tCommit(t){t.remain=tRem(t);if(t.since)t.since=Date.now();}
function subThr(m,side){return .55+rng(hash(S.salt+m.id+side+'sub'))()*.38;}

/* ---------- routing ---------- */
function route(){const h=(location.hash||'#/').replace(/^#\/?/,'').split('/')[0];return h||'console';}
const TABS=[['console','คอนโซล'],['draft','Ban/Draft'],['live','แข่งสด'],['judge','กรรมการ AI'],['reveal','เปิดคะแนน'],['vote','โหวต'],['result','ผลแพ้ชนะ'],['bracket','สายการแข่ง'],['board','จอใหญ่'],['timer','จอนาฬิกา']];
let lastRoute=null;

function render(){
  const r=route();const m=cur();
  document.body.classList.toggle('stage',r==='board'||r==='timer');
  $('#tabs').innerHTML=TABS.map(([k,l])=>{const si=STEPS.findIndex(s=>s.r===k);const locked=si>=0&&(!m||si>m.step);
    return `<a href="#/${k==='console'?'':k}"${r===k?' aria-current="page"':''}>${esc(l)}${locked?' <span class="lk" aria-label="ยังไม่ถึงขั้นนี้">🔒</span>':''}</a>`;}).join('');
  $('#livepill').innerHTML=m?`<span class="dot" aria-hidden="true"></span><span>${esc(ROUND[m.r])}${esc(matchNo(m))} · ${esc(team(m.a).name)} vs ${esc(team(m.b).name)}</span>`:(champion()?`<span>🏆 แชมป์: ${esc(champion().name)}</span>`:'');
  const V={console:vConsole,draft:vDraft,live:vLive,judge:vJudge,reveal:vReveal,vote:vVote,result:vResult,bracket:vBracket,board:vBoard,timer:vTimer}[r]||vConsole;
  $('#main').innerHTML=V(m);

function say(msg){const el=$('#sr-live');el.textContent='';setTimeout(()=>{el.textContent=msg;},30);}

function head(t,sub){return `<h1>${t}</h1>${sub?`<p class="sub">${sub}</p>`:''}`;}
function locked(m,need){if(!m)return champView();
  return `${head('ยังไม่ถึงขั้นนี้')}<div class="panel lockbox"><div class="ic" aria-hidden="true">🔒</div><p>แมตช์ปัจจุบันยังอยู่ที่ขั้น <b>${esc(STEPS[m.step].l)}</b> — ต้องทำขั้นก่อนหน้าให้เสร็จก่อนจึงจะเข้าหน้า “${esc(need)}” ได้</p><a class="btn pri" href="#/${STEPS[m.step].r}">ไปขั้น ${esc(STEPS[m.step].l)} →</a></div>`;}

function ensurePool(m){if(m.draft.pool)return;const avail=PROBLEMS.filter(p=>!S.used.includes(p.id)).map(p=>p.id);const r=rng(hash(S.salt+m.id+'pool'));
  for(let i=avail.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[avail[i],avail[j]]=[avail[j],avail[i]];}m.draft.pool=avail.slice(0,6);save();}
function vDraft(m){
  if(!m)return champView();ensurePool(m);const d=m.draft;const n=d.acts.length;const turn=DRAFT_SEQ[n];
  const act=pid=>d.acts.find(a=>a.pid===pid);
  const spinning=d.spinAt&&!d.problem;

  if(d.problem)turnHtml=`<div class="turn"><span class="av" aria-hidden="true">🎯</span><div style="flex:1;min-width:180px"><b>ได้โจทย์แล้ว:</b> <span style="color:var(--gold)">${esc(prob(d.problem).t)}</span></div>${m.step===0?`<button class="btn pri big" type="button" data-act="goLive">ยืนยันโจทย์ & ไปแข่ง →</button>`:`<a class="btn" href="#/live">ไปหน้าแข่งสด →</a>`}</div>`;
  else if(turn){const side=turn[0];const T=team(m[side]);turnHtml=`<div class="turn ${side}" role="status"><span class="av ${side}" aria-hidden="true">${T.e}</span><div style="flex:1;min-width:180px"><div class="small muted">ตาของ</div><b class="${side==='a'?'ta':'tb'}">${esc(T.name)}</b> — ${turn[1]==='ban'?'<b>แบน</b> 1 ข้อที่ไม่อยากเจอ':'<b>เลือก</b> 1 ข้อที่อยากเล่น'}</div><div class="seq" aria-label="ลำดับ">${DRAFT_SEQ.map((s,i)=>`<span class="${i<n?'done':i===n?'now':''}">${s[0]==='a'?'A':'B'} ${s[1]==='ban'?'แบน':'เลือก'}</span>`).join('')}<span class="${n>=4?'now':''}">🎲 สุ่ม</span></div></div>`;}
  else turnHtml=`<div class="turn" role="status"><span class="av" aria-hidden="true">🎲</span><div style="flex:1;min-width:180px">ทั้งสองทีมเลือกแล้ว — <b>สุ่ม 1 ใน 2 ข้อ</b>ที่ถูกเลือกเป็นโจทย์จริงของคู่นี้</div><button class="btn gold big" type="button" data-act="spin"${spinning?' disabled':''}>${spinning?'<span class="spinner" aria-hidden="true"></span> กำลังสุ่ม…':'🎲 สุ่มโจทย์'}</button></div>`;
  const cards=d.pool.map(pid=>{const p=prob(pid);const a=act(pid);let cls='',stamp='';
    if(a&&a.type==='ban'){cls='banned';stamp=`<span class="stamp ban">แบนโดย ${esc(team(m[a.team]).name)}</span>`;}
    if(a&&a.type==='pick'){cls='pick-'+a.team;stamp=`<span class="stamp p${a.team}">เลือกโดย ${esc(team(m[a.team]).name)}</span>`;}
    if(d.problem===pid){cls+=' chosen';stamp=`<span class="stamp win">★ โจทย์จริง</span>`;}
    const canAct=turn&&!a&&!d.problem;
    return `<article class="pcard ${cls}" data-pid="${pid}" aria-label="${esc(p.t)}">${stamp}<span class="pid">${p.id}</span><h3>${esc(p.t)}</h3><p>${esc(p.d)}</p><div class="foot"><span class="cat">${esc(CAT[p.c])}</span><span class="small muted">${p.n} ชิ้นงาน</span>${canAct?`<button class="btn sm ${turn[1]==='ban'?'':'pri'}" type="button" data-act="draft" data-pid="${pid}" style="margin-left:auto">${turn[1]==='ban'?'✕ แบน':'✓ เลือก'}<span class="sr"> ข้อ ${esc(p.t)} แทน${esc(team(m[turn[0]]).name)}</span></button>`:''}</div></article>`;}).join('');
  return `${head('Ban / Draft โจทย์',`${esc(ROUND[m.r])}${esc(matchNo(m))} · สุ่มโจทย์มา 6 ข้อจากที่ยังไม่เคยใช้ → ผลัดกันแบนทีมละ 1 · เลือกทีมละ 1 · แล้วสุ่ม 1 ใน 2 ข้อที่เลือก`)}
  <div class="panel">${vsBlock(m)}${turnHtml}<div class="pgrid">${cards}</div>${!d.problem&&n>0?`<p style="margin:12px 0 0"><button class="btn sm ghost" type="button" data-act="undoDraft">↶ ย้อนการเลือกล่าสุด</button></p>`:''}</div>`;
}

function jobState(m,i){const j=m.judge.jobs[i];const f=Math.min(1,(Date.now()-j.since)/JOB_MS[i]);return{f,st:f>=1?'done':f<.1?'queued':'running'};}

  const jobCard=(side,i)=>{const T=team(m[side]);const j=J.jobs[i];return `<div class="job"><div class="row" style="justify-content:space-between"><b class="${side==='a'?'ta':'tb'}">${T.e} ${esc(T.name)}</b><span data-dyn="jchip-${i}"></span></div>

   <table class="sc"><thead><tr><th scope="col">มิติ</th><th scope="col">เหตุผลจากกรรมการ AI</th><th scope="col" style="text-align:right">คะแนน</th></tr></thead><tbody>${DIMS.map(d=>`<tr><th scope="row" style="color:var(--fg);font-size:14px;font-weight:400">${esc(d.l)}</th><td class="small muted">${esc(r.dims[d.k].why)}</td><td class="v">${r.dims[d.k].v}<span class="muted small">/${d.mx}</span></td></tr>`).join('')}</tbody>

function vReveal(m,board){
  if(!m||m.step<3)return board?'':locked(m,'เปิดคะแนน');
  const s=scores(m);const k=m.reveal;let ta=0,tb=0;
  DIMS.forEach((d,i)=>{if(i<k){ta+=s.a.dims[d.k].v;tb+=s.b.dims[d.k].v;}});
  ta=Math.round(ta*10)/10;tb=Math.round(tb*10)/10;
  const rows=DIMS.map((d,i)=>{const shown=i<k;const va=s.a.dims[d.k].v,vb=s.b.dims[d.k].v;const isNew=i===k-1&&justRevealed;
    const lab=`<div class="dlabel">${esc(d.l)}<span class="mx">เต็ม ${d.mx}</span></div>`;
    return `<div class="drow${shown?'':' hid'}${isNew?' new':''}"${shown?'':' aria-hidden="true"'}>
      <div class="bars l"><div class="barw l" aria-hidden="true"><span class="bar" style="--w:${shown?va/d.mx*100:0}%"></span></div></div>
      <div class="dv a${shown&&va>vb?' win':''}">${shown?va:'?'}</div>${lab}<div class="dv b${shown&&vb>va?' win':''}">${shown?vb:'?'}</div>
      <div class="bars r"><div class="barw r" aria-hidden="true"><span class="bar" style="--w:${shown?vb/d.mx*100:0}%"></span></div></div></div>
      ${shown&&!board?`<div class="why"><p>${esc(s.a.dims[d.k].why)}</p><p>${esc(s.b.dims[d.k].why)}</p></div>`:''}${shown?`<span class="sr">${esc(d.l)}: ${esc(team(m.a).name)} ${va} คะแนน, ${esc(team(m.b).name)} ${vb} คะแนน</span>`:''}`;}).join('');
  const A=team(m.a),B=team(m.b);
  const top=`<div class="rv-top"><div class="tot a${k===4&&ta>tb?' lead':''}"><div style="font-size:30px" aria-hidden="true">${A.e}</div><div class="nm">${esc(A.name)}</div><div class="val" data-count="${ta}">${ta}</div><div class="mx">AI Score / 100</div></div><div class="x" aria-hidden="true">VS</div><div class="tot b${k===4&&tb>ta?' lead':''}"><div style="font-size:30px" aria-hidden="true">${B.e}</div><div class="nm">${esc(B.name)}</div><div class="val" data-count="${tb}">${tb}</div><div class="mx">AI Score / 100</div></div></div>`;
  if(board)return top+`<div style="max-width:1050px;margin:0 auto;width:100%">${rows}</div>`;
  const nextBtn=k<4?`<button class="btn gold big" type="button" data-act="revealNext">เปิดมิติที่ ${k+1}: ${esc(DIMS[k].l)} <span class="small">(Space)</span></button>`:(m.step===3?`<button class="btn pri big" type="button" data-act="goVote">ไปโหวตผู้ชม →</button>`:`<a class="btn" href="#/vote">ไปหน้าโหวต →</a>`);
  return `${head('เปิดคะแนนทีละมิติ','กดเปิดทีละมิติให้ลุ้นบนเวที · จอใหญ่แสดงตามทันที')}
   <section class="panel">${top}${rows}<div class="row" style="justify-content:center;margin-top:16px">${nextBtn}${k>0&&k<4?`<button class="btn ghost" type="button" data-act="revealAll">เปิดทั้งหมด</button>`:''}</div>
   ${k===4?`<p class="small muted" style="text-align:center;margin-bottom:0">AI Score ครบแล้ว · ${ta===tb?'เสมอกัน':`<b class="${ta>tb?'ta':'tb'}">${esc((ta>tb?A:B).name)}</b> นำ ${Math.abs(Math.round((ta-tb)*10)/10)} คะแนน`} — ยังมีโหวตผู้ชมอีกสูงสุด 10 คะแนน</p>`:''}</section>`;
}
let justRevealed=false;

function qrSvg(m){const r=rng(hash(S.salt+m.id+'qr'));const n=21;let rects='';const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#000"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(r()<.48)rects+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#000"/>`;}
  return `<svg viewBox="0 0 ${n} ${n}" role="img" aria-label="QR โหวต (ตัวอย่าง ใช้งานไม่ได้)" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/>${rects}${finder(0,0)}${finder(14,0)}${finder(0,14)}</svg>`;}
function vVote(m,board){

  const body=`<div class="vgrid"><div>${bar('a',A)}${bar('b',B)}<p class="small muted" data-dyn="vtot"></p></div><div style="text-align:center"><div class="qr">${qrSvg(m)}</div><p class="small muted">สแกนเพื่อโหวต (ตัวอย่าง)</p></div></div>`;
  if(board)return `<div class="panel" style="max-width:1000px;margin:0 auto;width:100%;text-align:left">${body}</div>`;

    <tr><th scope="row" class="ta" style="font-weight:600">${esc(A.name)}</th><td class="v">${f.ai.a}</td><td class="v">+${f.vote.a}</td><td class="v" style="color:var(--gold)">${f.fin.a}</td></tr>
    <tr><th scope="row" class="tb" style="font-weight:600">${esc(B.name)}</th><td class="v">${f.ai.b}</td><td class="v">+${f.vote.b}</td><td class="v" style="color:var(--gold)">${f.fin.b}</td></tr></tbody></table>
    ${m.step===4?`<button class="btn pri big" type="button" data-act="goResult">สรุปผลแพ้ชนะ →</button>`:`<a class="btn" href="#/result">ไปหน้าผลแพ้ชนะ →</a>`}</div>`;}

function go(h){if(location.hash===h)render();else location.hash=h;}
const ACT={
  reset(){doReset();},
  draft(ds){const m=cur();const d=m.draft;const turn=DRAFT_SEQ[d.acts.length];if(!turn||d.acts.some(a=>a.pid===ds.pid))return;
    d.acts.push({team:turn[0],type:turn[1],pid:ds.pid});addLog(`${team(m[turn[0]]).name} ${turn[1]==='ban'?'แบน':'เลือก'}โจทย์ ${ds.pid}`);say(`${team(m[turn[0]]).name} ${turn[1]==='ban'?'แบน':'เลือก'} ${prob(ds.pid).t}`);save();render();
    const nb=document.querySelector('[data-act="draft"],[data-act="spin"]');if(nb)nb.focus({preventScroll:true});},

  spin(){const m=cur();if(m.draft.spinAt)return;m.draft.spinAt=Date.now();save();render();},

  tToggle(){const t=cur().timer;if(t.since){tCommit(t);t.since=null;addLog('หยุดนาฬิกาชั่วคราว');}else{if(tRem(t)<=0)return;t.since=Date.now();addLog('เริ่มจับเวลา');}save();render();},

  tEnd(){const t=cur().timer;t.remain=0;t.since=Date.now();save();tick();},
  goJudge(){const m=cur();if(!(m.subs.a&&m.subs.b))return;tCommit(m.timer);m.timer.since=null;m.step=2;addLog('ปิดรอบแข่ง · ส่งผลงานเข้าคิวตรวจ');save();go('#/judge');},
  startJudge(){const m=cur();if(m.judge)return;const now=Date.now();const r=rng(hash(S.salt+m.id+'job'));const id=()=>'jb-'+Math.floor(r()*0xffffff).toString(16).padStart(6,'0');
    m.judge={jobs:[{id:id(),since:now},{id:id(),since:now+350}],doneLogged:false};addLog('สร้างงานตรวจ 2 job · เริ่ม poll');save();render();},
  goReveal(){const m=cur();m.step=3;m.reveal=0;addLog('เข้าสู่การเปิดคะแนนบนเวที');save();go('#/reveal');},
  revealNext(){const m=cur();if(m.reveal>=4)return;m.reveal++;justRevealed=true;const d=DIMS[m.reveal-1];const s=scores(m);addLog(`เปิดมิติ ${d.l}: ${s.a.dims[d.k].v} vs ${s.b.dims[d.k].v}`);save();render();justRevealed=false;countUp();
    const b=document.querySelector('[data-act="revealNext"],[data-act="goVote"]');if(b)b.focus({preventScroll:true});},
  revealAll(){const m=cur();m.reveal=4;addLog('เปิดคะแนนครบทุกมิติ');save();render();},
  goVote(){const m=cur();m.step=4;save();go('#/vote');},

    if(nx){const t=mById(nx[0]);t[nx[1]]=m.winner;addLog(`${team(m.winner).name} เข้าสู่${ROUND[t.r]}`);toast(`${team(m.winner).name} เข้าสู่${ROUND[t.r]} · ไปแมตช์ถัดไป`);save();go('#/');}
    else{addLog(`🏆 ${team(m.winner).name} คว้าแชมป์`);save();go('#/bracket');}}
};

/* ---------- animations ---------- */
function countUp(){if(RM)return;document.querySelectorAll('.tot .val[data-count]').forEach(el=>{const to=parseFloat(el.dataset.count);const from=Math.max(0,to-30);const t0=performance.now();
  (function step(t){const f=Math.min(1,(t-t0)/1100);const v=from+(to-from)*(1-Math.pow(1-f,3));el.textContent=f<1?v.toFixed(0):String(to);if(f<1)requestAnimationFrame(step);})(t0);});}
function confetti(){const c=$('#cf');if(!c||c.childElementCount)return;const cols=['#FFD600','#0D96C2','#FF8800','#7fe3ff','#35c46a'];let h='';for(let i=0;i<60;i++){h+=`<i style="left:${Math.random()*100}%;background:${cols[i%5]};animation-duration:${1.8+Math.random()*1.8}s;animation-delay:${Math.random()*.6}s"></i>`;}c.innerHTML=h;}

/* ---------- ticker ---------- */
const PH=['เข้าคิว','อ่านผลงาน + ประวัติ prompt','เทียบกับเกณฑ์ในโจทย์','ให้คะแนนตามรูบริก 4 มิติ','เขียน feedback'];
function setAll(sel,fn){document.querySelectorAll(sel).forEach(fn);}
function tick(noTransition){
  const m=cur();if(!m)return;let changed=false;
  // draft spin
  if(m.draft.spinAt&&!m.draft.problem){const el=Date.now()-m.draft.spinAt;const picks=m.draft.acts.filter(a=>a.type==='pick').map(a=>a.pid);
    if(el>=(RM?200:2200)){const r=rng(hash(S.salt+m.id+'spin'));m.draft.problem=picks[r()<.5?0:1];addLog(`สุ่มได้โจทย์ ${m.draft.problem} · ${prob(m.draft.problem).t}`);say('สุ่มได้โจทย์ '+prob(m.draft.problem).t);changed=true;}
    else{const i=Math.floor(el/140)%2;setAll('.pcard',c=>c.classList.toggle('spin',c.dataset.pid===picks[i]));}}
  // timer
  if(m.step>=1){const t=m.timer;const rem=tRem(t);
    if(m.step===1){const frac=1-rem/DUR;['a','b'].forEach(s=>{if(!m.subs[s]&&(frac>=subThr(m,s)||rem<=0)){m.subs[s]={at:fmt(rem)};addLog(`${team(m[s]).name} ส่งงานแล้ว${rem<=0?' (อัตโนมัติเมื่อหมดเวลา)':''}`);say(team(m[s]).name+' ส่งงานแล้ว');changed=true;}});}
    if(rem<=0&&t.since){t.remain=0;t.since=null;addLog('หมดเวลา!');changed=true;}
    setAll('[data-dyn="tmr"],[data-dyn="tmrbig"]',el=>{el.textContent=fmt(rem);el.classList.toggle('warn',rem>0&&rem<=120000);el.classList.toggle('over',rem<=0);});
    setAll('[data-dyn="tbar"]',el=>{el.style.width=(Math.min(1,rem/DUR)*100)+'%';});}
  // judge
  if(m.judge){const J=m.judge;let all=true;J.jobs.forEach((j,i)=>{const s=jobState(m,i);if(s.st!=='done')all=false;
      const pr=document.querySelector(`[data-dyn="jprog-${i}"]`);if(pr){const pct=Math.round(s.f*100);pr.querySelector('i').style.width=pct+'%';pr.setAttribute('aria-valuenow',pct);pr.classList.toggle('done',s.st==='done');}
      const ch=document.querySelector(`[data-dyn="jchip-${i}"]`);if(ch)ch.innerHTML=s.st==='done'?'<span class="chip ok">✓ done</span>':s.st==='queued'?'<span class="chip">queued</span>':'<span class="chip run">running</span>';
      const ph=document.querySelector(`[data-dyn="jphase-${i}"]`);if(ph)ph.textContent=s.st==='done'?'ตรวจเสร็จ · ผลพร้อมแสดง':PH[Math.min(4,Math.floor(s.f*5))]+'… '+Math.round(s.f*100)+'%';});
    const pl=document.querySelector('[data-dyn="poll"]');if(pl){const t0=J.jobs[0].since;const n=Math.floor((Date.now()-t0)/800);const lines=[];
      for(let k=Math.max(0,n-5);k<=n;k++){const at=t0+k*800;const i=k%2;const j=J.jobs[i];const f=Math.max(0,Math.min(1,(at-j.since)/JOB_MS[i]));const st=f>=1?'done':f<.1?'queued':'running';
        lines.push(`<div class="${st==='done'?'ok':'run'}">#${String(k+1).padStart(3,'0')} GET /judge/jobs/${j.id} → ${st}${st==='done'?'':' '+Math.round(f*100)+'%'}</div>`);}
      if(all)lines.push('<div class="ok">✓ ทุก job เสร็จ · หยุด poll</div>');pl.innerHTML=lines.slice(-7).join('');}
    if(all&&!J.doneLogged){J.doneLogged=true;addLog('กรรมการ AI ตรวจเสร็จทั้ง 2 ทีม');say('กรรมการ AI ตรวจเสร็จแล้ว');changed=true;}}
  // vote
  if(m.step>=4&&m.vote.status!=='idle'){if(m.vote.status==='open'&&Date.now()-m.vote.since>=VOTE_MS){m.vote.status='closed';addLog('ปิดโหวตอัตโนมัติ');say('ปิดโหวตแล้ว');changed=true;}
    const v=voteNow(m);const tot=v.a+v.b||1;['a','b'].forEach(s=>{setAll(`[data-dyn="vc-${s}"]`,el=>{el.textContent=v[s];});setAll(`[data-dyn="vp-${s}"]`,el=>{el.textContent=Math.round(v[s]/tot*100);});setAll(`[data-dyn="vb-${s}"]`,el=>{el.style.width=(v[s]/tot*100)+'%';});});
    setAll('[data-dyn="vtot"]',el=>{el.textContent=`รวม ${v.a+v.b} โหวต`;});}
  if(changed){save();if(!noTransition)render();else setTimeout(render,0);}
}
setInterval(()=>tick(false),RM?500:200);

load();render();
})();
</script>
